services:
  spark-master-v2:
    container_name: spark-master-v2
    profiles:
      - all
      - spark
    build:
      context: ../dockerfiles
      dockerfile: spark-master.dockerfile
      args:
        - SPARK_MASTER_HADOOP_AWS_VERSION=${SPARK_MASTER_HADOOP_AWS_VERSION}
        - SPARK_MASTER_AWS_SDK_VERSION=${SPARK_MASTER_AWS_SDK_VERSION}
        - SPARK_MASTER_POSTGRES_JDBC_VERSION=${SPARK_MASTER_POSTGRES_JDBC_VERSION}
        - HOME=${HOME}
        - SPARK_NO_DAEMONIZE=${SPARK_NO_DAEMONIZE}
    environment:
      - SPARK_MODE=MASTER
      - SPARK_PUBLIC_DNS=spark-v2
    ports:
      - "127.0.0.1:7070:7070"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5050:4040"
      - "127.0.0.1:5051:4041"
    secrets:
      - source: spark_secrets
        target: /opt/spark/conf/spark-defaults.conf
    command: /opt/spark/sbin/start-master.sh

  spark-connect-v2:
    profiles:
      - all
      - spark
    depends_on:
      spark-master-v2:
        condition: service_started
    build:
      context: ..
      dockerfile: ./dockerfiles/spark-shared.dockerfile
      args:
        - MODEL_NAME=${SPARK_MODEL}
    container_name: spark-connect-v2
    environment:
      - HOME=${HOME}
      - SPARK_NO_DAEMONIZE=${SPARK_NO_DAEMONIZE}
      - SPARK_MODE=CONNECT
      - SPARK_SUBMIT_OPTS=-Duser.home=/tmp
    secrets:
      - source: spark_secrets
        target: /opt/spark/conf/spark-defaults.conf
    ports:
      - "127.0.0.1:4040:4040"
      - "127.0.0.1:15002:15002"
    volumes:
      # NOTE: if you move to let say "producion setting" and you are worried about the bind mount
      # you can remove thoes and use COPY in the image file , to copy the uitils and model 
      - shared_models:/app/lib/models:ro
      - shared_modules:/app/lib/utils:ro
    command: > 
      /opt/spark/bin/spark-submit
      --packages org.apache.hadoop:hadoop-aws:${SPARK_MASTER_HADOOP_AWS_VERSION},org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0
      --class org.apache.spark.sql.connect.service.SparkConnectServer
      --conf spark.jars.ivy=/tmp/.ivy
      --master spark://spark-master-v2:7077
    

  spark-worker-v2:
    env_file:
      - path: ../envs/spark_shared.env
      - path: ../envs/spark_worker.env
    build:
      context: ..
      dockerfile: ./dockerfiles/spark-shared.dockerfile
      args:
      - MODEL_NAME=${SPARK_MODEL}
    command: /opt/spark/sbin/start-worker.sh --cores ${SPARK_WORKER_NUM_OF_CORES:-2} --memory ${SPARK_WORKER_MEMORY:-2} spark://spark-master-v2:7077
    depends_on:
      spark-master-v2:
        condition: service_started
    deploy:
      mode: replicated
      replicas: ${SPARK_WORKER_REPLICAS}
    ports:
      - "8081"
    volumes:
      # NOTE: if you move to let say "producion setting" and you are worried about the bind mount
      # you can remove thoes and use COPY in the image file , to copy the uitils and model 
      - shared_models:/app/lib/models:ro
      - shared_modules:/app/lib/utils:ro
  
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER_FILE=/run/secrets/minio-creds-login
      - MINIO_ROOT_PASSWORD_FILE=/run/secrets/minio-creds-password
    secrets:
      - minio-creds-login
      - minio-creds-password    

    command: server /data --console-address ":9001"
  kafka-v2:
    image: apache/kafka:4.1.1
    profiles: ["kafka", "all"]
    container_name: kafka-v2
    env_file:
      - ../envs/kafka.env
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9091,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-v2:9092,EXTERNAL://localhost:9091
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-v2:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_CLUSTER_ID: "4L62ydgTyQN69Y3nRA6A6A" 
    volumes:
      - kafka_data_v2:/var/lib/kafka/data
      - ../configs/kafka_brokers/topic-init.sh:/tmp/scripts/topic-init.sh
    ports:
      - "127.0.0.1:9091:9091"
    
    
  postgres-v2:
    image: postgres:17-bookworm
    container_name: postgres-v2
    ports:
      - "127.0.0.1:5444:5432"
    env_file:
      - ../envs/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../sql/spark_pipline/batch_tracker.sql:/docker-entrypoint-initdb.d/init.sql


secrets:
  spark_secrets:
    file: ../secrets/spark-defaults.conf
  minio-creds-login:
    file: ../secrets/minio-login.txt
  minio-creds-password:
    file: ../secrets/minio-password.txt

networks:
  defaults:
    name: cluster_network_v3
volumes:
  extra_jarsV2:
  minio_data:
  spark_ivy_cache:
  kafka_data_v2:
  postgres_data:
  shared_models:
    driver: local # tell docker its local bind
    driver_opts:
      type: none # use none special type file system for this shared value
      o: bind # tell os that this is a bind 
      device: ${SHARED_MODELS_PATH} # the path to the mounted modlder
  shared_modules:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${SHARED_MODULES_PATH}
